schema_version: 1

context:
  version: "0.43.6"

package:
  name: aws-crt-cpp
  version: ${{ version }}

source:
  url: https://github.com/awslabs/aws-crt-cpp/archive/v${{ version }}.tar.gz
  sha256: a02687298bb6b0ee7cb3cac8055a4dbae505ddb6242f3e33596b2c63eb3d5ec5
  patches:
    - patches/0001-use-C-style-for-including-inttypes-in-bin-mqtt5_cana.patch

build:
  number: 1

requirements:
  build:
    - cmake
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - ninja
  host:
    - aws-c-common
    - aws-c-cal
    - aws-c-io
    - aws-c-event-stream
    - aws-c-http
    - aws-c-auth
    - aws-c-mqtt
    - aws-c-s3
    - aws-c-sdkutils
  run_exports:
    - ${{ pin_subpackage("aws-crt-cpp", upper_bound="x.x.x") }}

tests:
  - script:
      - if: unix
        then:
          - test -f $PREFIX/lib/libaws-c-io${SHLIB_EXT}
          - test -f $PREFIX/include/aws/io/io.h
      - if: win
        then:
          - if not exist %LIBRARY_INC%\\aws\\io\\io.h exit 1
          - if not exist %PREFIX%\\Library\\bin\\aws-c-io.dll exit 1
  - if: win and arm64
    then:
      requirements:
        run:
          - ${{ compiler('cxx') }}
          - cmake
      files:
        recipe:
          - CMakeLists.txt
          - consumer.cpp
      script:
        - cmake -S . -B consumer-build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%LIBRARY_PREFIX%"
        - cmake --build consumer-build
        - consumer-build\consumer.exe
        - dumpbin /headers "%LIBRARY_BIN%\aws-crt-cpp.dll" | findstr /I /C:"AA64 machine (ARM64)"
        - dumpbin /headers consumer-build\consumer.exe | findstr /I /C:"AA64 machine (ARM64)"
about:
  license: Apache-2.0
  license_file: LICENSE
  summary: C++ wrapper around the aws-c-* libraries. Provides Cross-Platform Transport Protocols and SSL/TLS implementations for C++.
  homepage: https://github.com/awslabs/aws-crt-cpp
  repository: https://github.com/awslabs/aws-crt-cpp

extra:
  feedstock-name: aws-crt-cpp
  recipe-maintainers:
    - xhochy
    - conda-forge/aws-sdk-cpp
